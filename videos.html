</div>

    <div class="video-modal" id="videoModal">
        <span class="close-video" id="closeVideo">&times;</span>
        <div class="video-container">
            <video id="fullVideoPlayer" controls style="width: 100%; border-radius: 12px;"></video>
        </div>
    </div>

    <script>
        const videoCards = document.querySelectorAll('.video-card');
        const videoModal = document.getElementById('videoModal');
        const fullVideoPlayer = document.getElementById('fullVideoPlayer');
        const closeVideo = document.getElementById('closeVideo');

        // 1. لما تدوس على أي كارت
        videoCards.forEach(card => {
            card.addEventListener('click', () => {
                const videoSrc = card.getAttribute('data-video'); // هات اسم الفيديو المظبوط
                fullVideoPlayer.src = videoSrc; // حطه في الشاشة الكبيرة
                videoModal.style.display = 'flex'; // أظهر الشاشة الكبيرة
                
                // استنى لحظة صغيرة عشان الشاشة تظهر، وبعدين ارفع الـ opacity (عشان الأنيميشن)
                setTimeout(() => { videoModal.style.opacity = '1'; }, 10);
                fullVideoPlayer.play(); // شغل الفيديو بالصوت
            });
        });

        // 2. كود قفل الشاشة الكبيرة
        const closeFullVideo = () => {
            videoModal.style.opacity = '0'; // اختفاء ناعم
            setTimeout(() => { 
                videoModal.style.display = 'none'; // اخفيها خالص
                fullVideoPlayer.pause(); // وقف الفيديو
                fullVideoPlayer.src = ''; // فضي المشغل عشان الصوت ميستمرش
            }, 300);
        };

        // 3. اقفل لما تدوس على علامة X
        closeVideo.addEventListener('click', closeFullVideo);

        // 4. اقفل لو دوست في أي مكان أسود فاضي
        videoModal.addEventListener('click', (e) => {
            if (e.target === videoModal) closeFullVideo();
        });
    </script>

</body>
